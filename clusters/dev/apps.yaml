apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sdfcc-dev-apps
  namespace: flux-system
spec:
  # Unsuspend only after publishing an ARM64-capable release and updating tags.
  suspend: true
  dependsOn:
    - name: sdfcc-dev-infrastructure
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./clusters/dev/apps
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
