apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: sdfcc-dev
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: sdfcc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: sdfcc
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
