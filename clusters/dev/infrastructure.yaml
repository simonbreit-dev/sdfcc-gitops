apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sdfcc-dev-infrastructure
  namespace: flux-system
spec:
  # Keep suspended until the SOPS age key and encrypted database Secret exist.
  suspend: true
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./clusters/dev/infrastructure
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
