replicaCount: 1

image:
  repository: ghcr.io/simonbreit-dev/software-development-cloud-computing26/sdfcc-backend
  # The tag documents the release; the digest is the immutable multi-platform
  # index selected by Kubernetes for the node architecture.
  tag: sha-4c16932
  digest: sha256:0c482d7ff25e29e8689e7b020a1ef5b6ffd263a7165bf4da5aebc55869628730
  pullPolicy: IfNotPresent

secret:
  enabled: false
  existingSecretName: sdfcc-database
  rolloutToken: "1"

config:
  SPRING_PROFILES_ACTIVE: demo
  SERVER_PORT: "8080"
  DEPLOYMENT_ENVIRONMENT: local-k3s
  APP_SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:5173
  OTEL_TRACES_EXPORTER: none
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

service:
  type: ClusterIP
  port: 8080
  targetPort: http

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi
